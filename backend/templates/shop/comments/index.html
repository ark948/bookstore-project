{% extends "_base.html" %}
{% load static %}

{% block content %}
    <div>
        <div>
            <span>تعداد کل نظرات: {{ total }}</span>
        </div>

        <div>
            <span>تعداد نظرات در انتظار بررسی {{ total_waiting }}</span>
            <div>
                <a class="link"
                    hx-get="{% url 'shop:load_comments' 'pending' %}"
                    hx-target="#comments"
                    hx-trigger="click"
                    hx-swap="innerHTML"
                    >
                لیست
            </a>
            </div>
        </div>

        <div>
            <span>تعداد نظرات ثبت شده {{ total_approved }}</span>
        </div>

        <div>
            <span>تعداد نظرات رد شده {{ total_rejected }}</span>
        </div>

        <div id="comments">

        </div>
    </div>
{% endblock content %}
