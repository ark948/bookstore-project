<aside class="w-1/3 bg-white p-4 rounded shadow">
    <h2 class="text-lg font-semibold mb-4">فیلتر ها</h2>
    <div class="mb-4">
      <label class="block mb-1 font-medium">دسته بندی</label>
      <select class="select select-accent border border-gray-300 rounded p-2" id="genre_select"
          name="genreSelect"
          hx-get="{% url 'shop:filter_genre' %}"
          hx-trigger="change"
          hx-target="#books_list"
          hx-indicator="#spinner"
          hx-include="[name='genreSelect']"
          hx-swap="outerHTML"
        >
        <option>کل موضوعات</option>
        {% for genre in genres %}
          <option>{{ genre.title }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-4">
      <label for="filter_only_available">فقط موجود</label>
      <input type="hidden" name="status" value="off">
      <input
          hx-trigger="change"
          hx-get="{% url 'shop:only_available' %}"
          hx-target="#books_list"
          hx-swap="outerHTML"
          type="checkbox"
          class="toggle toggle-accent" 
          id="filter_only_available"
          value="on"
          name="status"
          hx-indicator="#spinner"
          onclick="calc();"
        />
    </div>

    <div class="mb-4" id="filter_by_price_range">
      <label class="block mb-1 font-medium">قیمت</label>
      <input type="range" min="0" max="1000000" class="range range-info w-full" id="price_range" name="priceRange" />
        <div>
          <span id="price_range_value">0 تومان</span>
          <script>
            $('#price_range').change(function(e) {
              var price = Number(e.target.value);
              var numstr = price.toLocaleString()
              $('#price_range_value').html(`${numstr} تومان`);
            });
          </script>
        </div>
    </div>
    <div class="flex flex-col space-y-4">
      <button class="btn btn-info btn-outline w-full"
        hx-get="{% url 'shop:filter_price' %}"
        hx-target="#books_list"
        hx-trigger="click"
        hx-swap="outerHTML"
        hx-include="[name='priceRange']"
        hx-indicator="#spinner">
        اعمال قیمت
      </button>
      <button class="btn btn-warning btn-outline w-full" onclick="clearFilters();">
        حذف فیلتر ها
      </button>
    </div>
    <script>
      function clearFilters() {
        $('#price_range').val("");
        $('#price_range_value').html("0 تومان");
        document.getElementById('filter_only_available').checked = false;
      }

      function calc() {
        if (document.getElementById('filter_only_available').checked)
        {
          console.log("checked");
        } else {
          console.log("unchecked");
        }
      }
    </script>
</aside>
