{% load static %}
<div class="container mx-auto p-6">

    <div class="mb-6">
      <input
        type="text"
        placeholder="جستجو..."
        class="w-full p-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div class="flex flex-row-reverse gap-6" dir="rtl">

      <aside class="w-1/3 bg-white p-4 rounded shadow">
        <h2 class="text-lg font-semibold mb-4">فیلتر ها</h2>
        <div class="mb-4">
          <label class="block mb-1 font-medium">دسته بندی</label>
          <select class="w-full border border-gray-300 rounded p-2">
            <option>کل موضوعات</option>
            <option>رمان</option>
            <option>تاريخ</option>
            <option>علوم</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">قیمت</label>
          <input type="range" min="0" max="100" class="w-full" />
        </div>
        <button class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">اعمال فیلتر ها</button>
      </aside>

      <section class="w-2/3 grid grid-cols-1 gap-6">

        {% for item in items %}
          <article class="bg-white p-4 rounded shadow flex gap-4">
              {% if item.cover_image %}
              <img src="{{ item.cover_image.url }}" alt="Cover image for {{ item.title }}" class="w-24 flex-shrink-0 rounded">
              {% else %}
                  [NO_COVER]
              {% endif %}
            <div>
              <h3 class="font-semibold text-lg mb-1">
                {{ item.title }}
              </h3>
              <p class="text-gray-700 mb-2">
                {{ item.summary }}
              </p>
              <p class="font-bold text-indigo-600">
                {{ item.price }}
              </p>
              <p>
                <a href="{% url 'shop:item_detail' %}">
                  جزئیات
                </a>
              </p>
            </div>
          </article>
        {% endfor %}

      </section>

    </div>
</div>
