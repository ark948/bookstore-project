<dialog id="genres_list_modal" class="modal">
    <div class="modal-box">
        <div>
            <table class="table table-xs">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>PK</th>
                        <th>Title</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ item.pk }}</td>
                            <td>{{ item.title }}</td>
                            <td>
                                <div>
                                    <button class="btn btn-xs btn-outline btn-info m-1">ویرایش</button>
                                    <button class="btn btn-xs btn-outline btn-error m-1">حذف</button>
                                    <button class="btn btn-xs btn-outline btn-neutral">کتاب ها</button>
                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
      <div class="modal-action">
        <form method="dialog">
          <!-- if there is a button in form, it will close the modal -->
          <button class="btn">Close</button>
        </form>
      </div>
    </div>
  </dialog>
