<div>
    <p>
        ویرایش {{ item_id }}
    </p>
{% if form %}
    
    <form method="post" action="{% url 'shop:edit-process' form.instance.id %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary btn-xs" type="submit">Save</button>
    </form>

{% else %}
    <p>فرم یافت نشد.</p>
{% endif %}
</div>
