{% load crispy_forms_tags %}

            {% csrf_token %}

            {{ form|crispy }}

            <button class="btn btn-primary btn-xs">
                ثبت

            <button class="btn btn-error btn-xs">
                لغو
            </button>
        </form>
    {% endif %}
</div>
