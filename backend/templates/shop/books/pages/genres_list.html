{% extends "_base.html " %}

{% block content %}
    <h3>لیست ژانر ها</h3>
    <div>
        <table class="table table-xs">
            <thead>
                <tr>
                    <th>#</th>
                    <th>PK</th>
                    <th>Title</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ item.pk }}</td>
                        <td>{{ item.title }}</td>
                        <td>
                            <div>
                                <button class="btn btn-xs btn-outline btn-info m-1">ویرایش</button>
                                <button class="btn btn-xs btn-outline btn-error m-1">حذف</button>
                                <button class="btn btn-xs btn-outline btn-neutral">کتاب ها</button>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <a class="btn btn-neutral btn-outline btn-xs w-32" href="{% url 'shop:employee' %}">بازگشت</a>
{% endblock content %}
