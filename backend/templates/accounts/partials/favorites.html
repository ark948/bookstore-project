<div id="fav_items_container">
    <ul>
    {% if items %}
        {% for item in items %}
            <li id="item_container">{{ item.book_id.title }} - {{ item.book_id.price }} - 
                <a class="link link-success" href="{% url 'shop:item_detail' id=item.book_id.id %}">=></a>
                <a class="link link-error"
                        hx-get="{% url 'accounts:remove_favorite' %}"
                        hx-trigger="click"
                        hx-target="#fav_items_container"
                        hx-vals='{"item_id": "{{ item.book_id.id }}"}'
                    >
                    حذف
                </a>
            </li>
        {% endfor %}
    {% else %}
        <span>لیست خالی می‌باشد.</span>
    {% endif %}
    </ul>
</div>
