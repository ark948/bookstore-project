<table class="table table-xs">
    <thead>
        <tr class="text-gray-900 text-center">
            <th>#</th>
            <th>عنوان</th>
            <th>موجود</th>
            <th>قیمت</th>
            <th>لینک</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
            <tr class="text-center">
                <td>{{ forloop.counter }}</td>
                <td>{{ item.book_id.title }}</td>
                <td>
                    {% if item.book_id.available %}
                      <span>&#10003;</span>
                    {% else %}
                      <span>&#10007;</span>
                    {% endif %}
                  </td>
                <td>{{ item.book_id.price }}</td>
                <td><a class="link link-success" href="{% url 'shop:item_detail' id=item.book_id.id %}">=></a></td>
                <td>
                    <a class="link link-error"
                        hx-get="{% url 'accounts:remove_favorite' %}"
                        hx-trigger="click"
                        hx-target="#fav_items_container"
                        hx-vals='{"item_id": "{{ item.book_id.id }}"}'
                    >
                    حذف
                </a>
                </td>
            </tr>
        {% empty %}
            لیست شما خلی می‌باشد.
        {% endfor %}
    </tbody>
    <tfoot></tfoot>
</table>
