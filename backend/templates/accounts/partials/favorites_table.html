{% load static %}

{% if items %}
    <div class="flex flex-row-reverse">
        {% for item in items %}
            <div class="max-w-xs bg-white rounded-lg shadow-md overflow-hidden mr-4">
                <img class="w-24 h-24 mx-auto mt-4 object-cover rounded" src="{{ item.book_id.cover_image.url }}" alt="Product Image" />
                <div class="p-4 text-center">
                <h2 class="text-lg font-semibold text-gray-800">{{ item.book_id.title }}</h2>
                <p class="mt-2 text-gray-600">{{ item.book_id.price }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
{% endif %}
