{% extends "_base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="min-h-screen flex items-start mt-8 justify-center pt-24">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-6 text-center">ورود به حساب</h2>
      <form class="space-y-5" method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <div>
          <label for="email" class="block mb-1 font-medium text-gray-700">ایمیل</label>
          {{ form.email|add_class:"input" }}
        </div>
        <div>
          <label for="password" class="block mb-1 font-medium text-gray-700">پسورد</label>
            {{ form.password|add_class:"input" }}
        </div>
        <button type="submit" class="btn btn-info w-full" >
          ورود
        </button>
      </form>
      <p class="mt-4 text-center text-sm text-gray-600">
        هنوز ثبت نام نکرده‌اید؟
        <a href="{% url 'accounts:signup' %}" class="text-indigo-600 hover:underline">ثبت نام</a>
      </p>
    </div>
  </div>
  
{% endblock content %}
